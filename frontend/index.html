<style>
:root {
  --bg: #f2ecd9;
  --surface: #fffcf3;
  --border: #ded0a8;
  --text: #2b2013;
  --text-muted: #7c6f4f;
  --accent: #35524a;
  --accent-hover: #263c36;
  --accent-light: #e7eee9;
  --success: #4c6f3d;
  --success-light: #edf3e6;
  --warning: #b17f1a;
  --warning-light: #faf0d9;
  --danger: #a13f24;
  --danger-light: #f9e9e2;
  --purple: #6a4a86;
  --purple-light: #efe8f4;
  --gold: #c99a2e;
  --gold-light: #f8eecd;
  --radius: 6px;
  --radius-lg: 10px;
  --shadow-sm: 0 1px 2px rgba(60,45,10,0.08);
  --shadow: 0 1px 3px rgba(60,45,10,0.10), 0 1px 2px rgba(60,45,10,0.08);
  --shadow-lg: 0 6px 14px rgba(60,45,10,0.12), 0 2px 6px rgba(60,45,10,0.08);
  --font: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  background: var(--bg);
  background-image:
    radial-gradient(circle at 1px 1px, rgba(60,45,10,0.05) 1px, transparent 0);
  background-size: 22px 22px;
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
}

/* -- Header -- */
.header {
  background: var(--surface);
  border-bottom: 2px solid var(--accent);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow-sm);
}
.header-brand {
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.header-brand .icon {
  font-size: 1.4rem;
  position: relative;
  top: 2px;
}
.header-brand span:last-child {
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 600;
  font-optical-sizing: auto;
  color: var(--accent);
  letter-spacing: -0.01em;
}
.header-brand::after {
  content: 'Catalogued. Matched. Ready by Monday.';
  font-family: var(--font);
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  border-left: 1px solid var(--border);
  padding-left: 12px;
  margin-left: 2px;
  align-self: center;
}
@media (max-width: 720px) { .header-brand::after { display: none; } }
.header-actions { display: flex; gap: 12px; align-items: center; }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 16px; border-radius: var(--radius);
  font-size: 0.875rem; font-weight: 600; font-family: var(--font);
  cursor: pointer; border: 1px solid transparent;
  transition: all 0.15s ease;
  white-space: nowrap;
}
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { background: var(--surface); color: var(--text); border-color: var(--border); }
.btn-secondary:hover { background: var(--bg); border-color: var(--accent); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #832f1a; }
.btn-success { background: var(--success); color: #fff; }
.btn-ghost { background: transparent; color: var(--text-muted); border-color: transparent; }
.btn-ghost:hover { background: var(--bg); color: var(--text); }
.btn-sm { padding: 4px 10px; font-size: 0.8rem; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.bundle-badge {
  background: var(--gold); color: #2b2013;
  border-radius: 999px; padding: 2px 8px; font-size: 0.75rem;
  font-family: var(--font-mono); font-weight: 700; min-width: 20px; text-align: center;
}

/* -- Tabs - styled as card-catalogue drawer tabs -- */
.tab-bar {
  display: flex; gap: 6px;
  background: transparent;
  border-bottom: 2px solid var(--accent);
  padding: 10px 24px 0;
}
.tab {
  padding: 12px 22px 14px; font-size: 0.9rem; font-weight: 600;
  cursor: pointer; border: 1px solid var(--border); border-bottom: none;
  background: var(--bg); font-family: var(--font);
  color: var(--text-muted);
  clip-path: polygon(6% 0, 94% 0, 100% 100%, 0% 100%);
  transition: all 0.15s ease;
  white-space: nowrap;
  position: relative;
  top: 2px;
}
.tab:hover { color: var(--text); background: var(--surface); }
.tab.active {
  color: #fff;
  background: var(--accent);
  border-color: var(--accent);
  font-family: var(--font-display);
  font-weight: 600;
  top: 0;
}
.tab.active .tab-subtitle { color: rgba(255,255,255,0.75); }
.tab-subtitle { font-weight: 400; font-size: 0.72rem; color: var(--text-muted); display: block; margin-top: 2px; }

/* -- Layout -- */
.main { max-width: 1280px; margin: 0 auto; padding: 28px 24px; }
.mode-panel {
  margin-bottom: 24px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 0 var(--radius-lg) var(--radius-lg) var(--radius-lg);
  padding: 20px;
  box-shadow: var(--shadow-sm);
}
.results-area { min-height: 200px; }

/* -- Guided Mode -- */
.guided-form { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
.guided-form .field { display: flex; flex-direction: column; gap: 4px; min-width: 160px; }
.guided-form label { font-size: 0.72rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; }
.guided-form select, .guided-form input {
  padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius);
  font-size: 0.875rem; font-family: var(--font); background: var(--surface);
  color: var(--text); min-width: 160px;
}
.guided-form select:focus, .guided-form input:focus {
  outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light);
}
.guided-form select:disabled { background: var(--bg); color: var(--text-muted); cursor: not-allowed; }
.constraints-field { flex: 1; min-width: 240px; }

/* -- Freetext Mode -- */
.freetext-form { display: flex; gap: 8px; }
.freetext-form input {
  flex: 1; padding: 12px 16px; border: 2px solid var(--border); border-radius: var(--radius-lg);
  font-size: 1rem; font-family: var(--font); background: var(--surface); color: var(--text);
}
.freetext-form input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
.freetext-form button { padding: 12px 24px; font-size: 1rem; }

/* -- Browse Mode -- */
.chip-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.chip-group-label { font-size: 0.72rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 6px 13px; border-radius: 999px;
  font-size: 0.8rem; font-weight: 500; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text); transition: all 0.12s ease;
  font-family: var(--font);
}
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* -- Results -- */
.results-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.results-header h2 { font-family: var(--font-display); font-size: 1.05rem; font-weight: 600; color: var(--accent); }

.results-layout { display: flex; gap: 20px; align-items: flex-start; }
.results-panel { flex: 1; min-width: 0; }
.bundle-panel { width: 320px; flex-shrink: 0; }
@media (max-width: 860px) {
  .results-layout { flex-direction: column; }
  .bundle-panel { width: 100%; }
}

.results-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
@media (max-width: 600px) { .results-grid { grid-template-columns: 1fr; } }

/* Cards styled as library index cards */
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px 14px 10px; box-shadow: 2px 2px 0 var(--border), var(--shadow);
  border-top: 3px solid var(--accent);
  transition: box-shadow 0.15s, transform 0.15s;
  position: relative;
}
.card:hover { box-shadow: 3px 3px 0 var(--accent), var(--shadow-lg); transform: translate(-1px, -1px); }
.card.ai-generated { border-top-color: var(--purple); }
.card.ai-generated:hover { box-shadow: 3px 3px 0 var(--purple), var(--shadow-lg); }
.card.selected {
  box-shadow: 0 0 0 2px var(--accent), 2px 2px 0 var(--border);
  border-color: var(--accent); border-left: 5px solid var(--accent);
  background: var(--accent-light);
}

.card-filename { font-family: var(--font-display); font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; color: var(--text); word-break: break-word; }
.card-description { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px; line-height: 1.4; }

.card-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.badge {
  display: inline-flex; align-items: center;
  padding: 1px 7px; border-radius: 999px;
  font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
  font-family: var(--font-mono);
}
.badge-subject { background: var(--accent-light); color: var(--accent); }
.badge-grade { background: var(--success-light); color: var(--success); }
.badge-format { background: var(--warning-light); color: var(--warning); }
.badge-ai { background: var(--purple-light); color: var(--purple); }
.badge-confidence {
  background: var(--gold-light); color: #8a6511;
  border: 1px solid var(--gold);
}

.card-add {
  display: flex; justify-content: space-between; border-top: 1px dashed var(--border); padding-top: 8px;
}
.card-add button {
  padding: 3px 10px; font-size: 0.72rem; border-radius: var(--radius); line-height: 1.4;
  border: 1px solid #d97706; background: #fff7ed;
  cursor: pointer; font-family: var(--font); font-weight: 600; color: #92400e;
  transition: all 0.1s ease;
}
.card-add button:hover { background: #d97706; color: #fff; border-color: #d97706; }
.card-add button.remove-action { background: var(--danger-light); border-color: var(--danger); color: var(--danger); }
.card-add button.remove-action:hover { background: var(--danger); color: #fff; }
.od-link {
  padding: 3px 10px; font-size: 0.72rem; border-radius: var(--radius); line-height: 1.4;
  border: 1px solid var(--accent); background: var(--accent-light);
  cursor: pointer; font-family: var(--font); font-weight: 600; color: var(--accent);
  text-decoration: none; transition: all 0.1s ease;
}
.od-link:hover { background: var(--accent); color: #fff; }

/* -- Bundle Sidebar -- */
.bundle-sidebar {
  background: #fdf8ec; border: 2px solid var(--accent); border-radius: var(--radius-lg);
  padding: 18px 16px; position: sticky; top: 80px;
  box-shadow: var(--shadow-lg);
}
.bundle-sidebar h3 {
  font-family: var(--font-display); font-size: 1rem; color: var(--accent);
  margin-bottom: 4px; padding-bottom: 10px; border-bottom: 2px solid var(--accent);
}
.bundle-sidebar .bundle-empty { font-size: 0.8rem; color: var(--text-muted); font-style: italic; }
.bundle-sidebar .bundle-item {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.8rem;
}
.bundle-item:last-child { border-bottom: none; }
.bundle-item-name { flex: 1; word-break: break-word; }
.bundle-item-name .ai-tag { font-size: 0.62rem; color: var(--purple); font-weight: 700; display: block; }
.bundle-item button {
  flex-shrink: 0; padding: 2px 8px; font-size: 0.68rem; border-radius: var(--radius);
  border: 1px solid var(--danger); background: transparent; color: var(--danger);
  cursor: pointer; font-family: var(--font); font-weight: 600;
  transition: all 0.1s ease;
}
.bundle-item button:hover { background: var(--danger); color: #fff; }
.bundle-download { margin-top: 14px; }
.bundle-download .btn { width: 100%; justify-content: center; }
.bundle-count-footer { font-size: 0.72rem; color: var(--text-muted); text-align: center; margin-top: 6px; }

/* -- Refinement Bar -- */
.refinement-bar {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 12px 16px; margin-bottom: 18px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  border-left: 3px solid var(--accent);
}
.refinement-bar label { font-size: 0.75rem; font-weight: 700; color: var(--accent); white-space: nowrap; text-transform: uppercase; letter-spacing: 0.05em; }
.refinement-bar .chip-group { margin-bottom: 0; }
.refinement-bar input {
  flex: 1; padding: 6px 12px; border: 1px solid var(--border); border-radius: var(--radius);
  font-size: 0.85rem; font-family: var(--font); min-width: 180px;
}
.refinement-bar input:focus { outline: none; border-color: var(--accent); }

/* -- Gaps Section -- */
.gaps-section { margin-bottom: 20px; }
.gap-card {
  background: var(--warning-light); border: 1px dashed var(--warning); border-radius: var(--radius-lg);
  padding: 14px 18px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.gap-card .gap-icon { font-size: 1.2rem; }
.gap-card .gap-text { flex: 1; font-size: 0.9rem; font-weight: 500; min-width: 200px; }
.gap-card .gap-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* -- Loading / Empty / Error -- */
.loading-spinner {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  padding: 40px; color: var(--text-muted); font-size: 0.9rem;
}
.spinner {
  width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.empty-state {
  text-align: center; padding: 56px 24px; color: var(--text-muted);
  background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius-lg);
}
.empty-state .empty-icon { font-size: 2.2rem; margin-bottom: 12px; }
.empty-state p { font-size: 0.95rem; max-width: 460px; margin: 0 auto; font-family: var(--font-display); color: var(--text); }

.error-banner {
  background: var(--danger-light); border: 1px solid var(--danger); border-radius: var(--radius);
  padding: 12px 18px; margin-bottom: 16px; color: var(--danger); font-size: 0.875rem; font-weight: 500;
}

/* -- Suggestion Cards -- */
.suggestion-card {
  background: var(--success-light); border: 1px solid var(--success); border-radius: var(--radius);
  padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin-bottom: 8px; flex-wrap: wrap;
}
.suggestion-card .sugg-text { font-size: 0.85rem; flex: 1; min-width: 200px; }

/* -- Download Progress -- */
.download-overlay {
  position: fixed; inset: 0; background: rgba(43,32,19,0.45);
  display: flex; align-items: center; justify-content: center; z-index: 200;
}
.download-dialog {
  background: var(--surface); border-radius: var(--radius-lg); padding: 32px 40px;
  text-align: center; box-shadow: var(--shadow-lg); border-top: 3px solid var(--accent);
}
.download-dialog .spinner { width: 36px; height: 36px; margin: 0 auto 16px; }
.download-dialog p { font-size: 0.95rem; color: var(--text); font-family: var(--font-display); }

/* -- Sign-in Prompt -- */
.auth-overlay {
  position: fixed; inset: 0; background: rgba(43,32,19,0.45);
  display: flex; align-items: center; justify-content: center; z-index: 200;
}
.auth-dialog {
  background: var(--surface); border-radius: var(--radius-lg); padding: 28px 32px;
  max-width: 420px; box-shadow: var(--shadow-lg); border-top: 3px solid var(--accent);
}
.auth-dialog h3 { font-family: var(--font-display); font-size: 1.05rem; color: var(--accent); margin-bottom: 8px; }
.auth-dialog p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px; line-height: 1.5; }
.auth-dialog .auth-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.auth-dialog .btn { flex: 1; min-width: 120px; justify-content: center; }
.auth-dialog .auth-note { font-size: 0.72rem; color: var(--text-muted); margin-top: 12px; font-style: italic; border-top: 1px solid var(--border); padding-top: 10px; }
.auth-status { font-size: 0.75rem; color: var(--success); margin-left: 8px; display: inline-flex; align-items: center; gap: 4px; }

/* -- Utility -- */
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
.divider { width: 1px; height: 20px; background: var(--border); margin: 0 8px; }

</style>
</head>
<body>

<div class="header">
  <div class="header-brand">
    <span class="icon">&#128218;</span>
    <span>Teacher's Pet</span>
  </div>
  <div class="header-actions">
    <span class="auth-status hidden" id="authStatus">&#128274; Signed in</span>
  </div>
</div>

<div class="tab-bar">
  <button class="tab active" data-tab="guided" onclick="switchTab('guided')">
    &#127919; I know my outcome
    <span class="tab-subtitle">Guided search</span>
  </button>
  <button class="tab" data-tab="freetext" onclick="switchTab('freetext')">
    &#128269; I remember a resource
    <span class="tab-subtitle">Free-text search</span>
  </button>
  <button class="tab" data-tab="browse" onclick="switchTab('browse')">
    &#10024; Surprise me
    <span class="tab-subtitle">Browse catalogue</span>
  </button>
</div>

<main class="main">
  <!-- Guided Mode Panel -->
  <div class="mode-panel" id="panel-guided">
    <form class="guided-form" onsubmit="return guidedSearch(event)">
      <div class="field">
        <label for="gSubject">Subject</label>
        <select id="gSubject" disabled onchange="onGuidedSubjectChange()">
          <option value="">- Loading curriculum... -</option>
          <option value="Language">Language (Primary Language Curriculum)</option>
          <option value="Maths">Maths (Primary Maths Curriculum)</option>
        </select>
      </div>
      <div class="field">
        <label for="gStrand">Strand</label>
        <select id="gStrand" disabled onchange="onGuidedStrandChange()">
          <option value="">- Select subject first -</option>
        </select>
      </div>
      <div class="field">
        <label for="gStage">Stage</label>
        <select id="gStage" disabled onchange="onGuidedStageChange()">
          <option value="">- Select strand first -</option>
        </select>
      </div>
      <div class="field">
        <label for="gOutcome">Outcome</label>
        <select id="gOutcome" disabled onchange="onGuidedOutcomeChange()">
          <option value="">- Select stage first -</option>
        </select>
      </div>
      <div class="field constraints-field">
        <label for="gConstraints">Additional constraints / preferences</label>
        <input type="text" id="gConstraints" placeholder="e.g. prefer games, EAL-friendly, group work">
      </div>
      <button type="submit" class="btn btn-primary" id="gSearchBtn" disabled>
        &#128269; Search
      </button>
    </form>
  </div>

  <!-- Freetext Mode Panel -->
  <div class="mode-panel hidden" id="panel-freetext">
    <form class="freetext-form" onsubmit="return freetextSearch(event)">
      <input type="text" id="ftQuery" placeholder="Describe the resource you're looking for - any detail helps" autocomplete="off">
      <button type="submit" class="btn btn-primary">&#128269; Search</button>
    </form>
  </div>

  <!-- Browse Mode Panel -->
  <div class="mode-panel hidden" id="panel-browse">
    <div class="chip-group-label">Subject</div>
    <div class="chip-group" id="browseSubjectChips"></div>
    <div class="chip-group-label">Grade band</div>
    <div class="chip-group" id="browseGradeChips"></div>
    <div class="chip-group-label">Format</div>
    <div class="chip-group" id="browseFormatChips"></div>
    <div class="chip-group-label">Season</div>
    <div class="chip-group" id="browseSeasonChips"></div>
  </div>

  <!-- Results Area -->
  <div class="results-area" id="resultsArea">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">&#128451;</div>
      <p>Pick a mode above, three ways in: know your outcome, remember a resource, or just browse.</p>
    </div>
    <div id="resultsContainer" class="hidden"></div>
  </div>
</main>

<div class="download-overlay hidden" id="downloadOverlay">
  <div class="download-dialog">
    <div class="spinner"></div>
    <p>Preparing your bundle...</p>
    <p style="font-size:0.8rem;color:var(--text-muted)">This may take a moment</p>
  </div>
</div>

<script>
/* -----------------------------------------------
   CONFIGURATION
   ----------------------------------------------- */
var WORKER_URL = 'https://teachers-pet.dan-m-kelly.workers.dev';
var TAXONOMY_BASE = 'https://raw.githubusercontent.com/danmkelly/CustEngageCA3/main/taxonomy';

/* -----------------------------------------------
   APPLICATION STATE
   ----------------------------------------------- */
var state = {
  activeMode: 'guided',
  taxonomies: { language: null, maths: null },
  catalogue: [],
  results: [],
  gaps: [],
  selectedIds: {},
  aiGenerated: [],
  loading: { taxonomy: false, catalogue: false, search: false, bundle: false, generate: false },
  guidedSelections: { subject: '', strand: '', stage: '', outcome: '' },
  browseFilters: { subject: {}, grade: {}, format: {}, season: {} },
  refinementText: '',
  refinementChips: {},
  lastQuery: null,
};

function objSize(o) { var n = 0; for (var k in o) { if (o.hasOwnProperty(k)) n++; } return n; }
function objKeys(o) { var a = []; for (var k in o) { if (o.hasOwnProperty(k)) a.push(k); } return a; }
function objValues(o) { var a = []; for (var k in o) { if (o.hasOwnProperty(k)) a.push(o[k]); } return a; }
function objHas(o, k) { return o.hasOwnProperty(k); }

/* -----------------------------------------------
   GUIDED MODE DROPDOWNS
   ----------------------------------------------- */
function populateGuidedDropdowns() {
  var lang = state.taxonomies.language;
  var maths = state.taxonomies.maths;
  if (!lang || !maths) return;
  var subjEl = document.getElementById('gSubject');
  subjEl.options[0].innerHTML = '- Select -';
  subjEl.disabled = false;
}

function onGuidedSubjectChange() {
  var lang = state.taxonomies.language;
  var maths = state.taxonomies.maths;
  var val = document.getElementById('gSubject').value;
  var strandEl = document.getElementById('gStrand');
  var stageEl = document.getElementById('gStage');
  var outEl = document.getElementById('gOutcome');

  state.guidedSelections.subject = val;
  state.guidedSelections.strand = '';
  state.guidedSelections.stage = '';
  state.guidedSelections.outcome = '';

  strandEl.innerHTML = '<option value="">- Select strand -</option>';
  strandEl.disabled = !val;
  stageEl.innerHTML = '<option value="">- Select strand first -</option>';
  stageEl.disabled = true;
  outEl.innerHTML = '<option value="">- Select stage first -</option>';
  outEl.disabled = true;

  if (val && ((lang && lang.strands) || (maths && maths.strands))) {
    var strands;
    if (lang && lang.strands) {
      strands = Object.keys(lang.strands);
    } else {
      strands = Object.keys(maths.strands);
    }
    strands.forEach(function(s) {
      var opt = document.createElement('option');
      opt.value = s; opt.textContent = s;
      strandEl.appendChild(opt);
    });
  }
  updateGuidedSearchBtn();
}

function onGuidedStrandChange() {
  var lang = state.taxonomies.language;
  var maths = state.taxonomies.maths;
  var val = document.getElementById('gStrand').value;
  var stageEl = document.getElementById('gStage');
  var outEl = document.getElementById('gOutcome');
  var subj = state.guidedSelections.subject;

  state.guidedSelections.strand = val;
  state.guidedSelections.stage = '';
  state.guidedSelections.outcome = '';

  stageEl.innerHTML = '<option value="">- Select stage -</option>';
  stageEl.disabled = !val;
  outEl.innerHTML = '<option value="">- Select stage first -</option>';
  outEl.disabled = true;

  if (!val) { updateGuidedSearchBtn(); return; }

  var stages = subj === 'Language' ? (lang && lang._stages) : (maths && maths._stages);
  if (stages) {
    var codes = Object.keys(stages);
    for (var i = 0; i < codes.length; i++) {
      var code = codes[i];
      var opt = document.createElement('option');
      opt.value = code;
      opt.textContent = code + ': ' + stages[code];
      stageEl.appendChild(opt);
    }
  }
  updateGuidedSearchBtn();
}

function onGuidedStageChange() {
  var lang = state.taxonomies.language;
  var maths = state.taxonomies.maths;
  var val = document.getElementById('gStage').value;
  var outEl = document.getElementById('gOutcome');
  var subj = state.guidedSelections.subject;
  var strand = state.guidedSelections.strand;

  state.guidedSelections.stage = val;
  state.guidedSelections.outcome = '';

  outEl.innerHTML = '<option value="">- Select outcome -</option>';
  outEl.disabled = !val;
  if (!val) { updateGuidedSearchBtn(); return; }

  if (subj === 'Language' && lang) {
    var strandObj = lang.strands[strand];
    if (strandObj && strandObj.elements) {
      var elemNames = Object.keys(strandObj.elements);
      for (var ei = 0; ei < elemNames.length; ei++) {
        var elemName = elemNames[ei];
        var elemData = strandObj.elements[elemName];
        if (elemData.outcomes) {
          for (var oi = 0; oi < elemData.outcomes.length; oi++) {
            var o = elemData.outcomes[oi];
            var opt = document.createElement('option');
            opt.value = JSON.stringify({ code: o.code, element: elemName, label: o.label });
            opt.textContent = o.code + ': ' + o.label + ' (' + elemName + ')';
            outEl.appendChild(opt);
          }
        }
      }
    }
  } else if (subj === 'Maths' && maths) {
    var strandObjM = maths.strands[strand];
    if (strandObjM && strandObjM.strand_units) {
      for (var ui = 0; ui < strandObjM.strand_units.length; ui++) {
        var u = strandObjM.strand_units[ui];
        var opt = document.createElement('option');
        opt.value = JSON.stringify({ code: u.id, name: u.name });
        opt.textContent = u.id + ': ' + u.name;
        outEl.appendChild(opt);
      }
    }
  }
  updateGuidedSearchBtn();
}

function updateGuidedSearchBtn() {
  var s = state.guidedSelections;
  document.getElementById('gSearchBtn').disabled = !(s.subject && s.strand && s.stage && s.outcome);
}

function onGuidedOutcomeChange() {
  state.guidedSelections.outcome = document.getElementById('gOutcome').value;
  updateGuidedSearchBtn();
}

/* -----------------------------------------------
   TAB SWITCHING
   ----------------------------------------------- */
function switchTab(mode) {
  state.activeMode = mode;
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) { tabs[i].classList.toggle('active', tabs[i].getAttribute('data-tab') === mode); }
  var panels = document.querySelectorAll('.mode-panel');
  for (var j = 0; j < panels.length; j++) { panels[j].classList.add('hidden'); }
  document.getElementById('panel-' + mode).classList.remove('hidden');

  if (mode === 'browse' && state.catalogue.length === 0) {
    loadCatalogue();
  }
  if (mode === 'browse') {
    renderBrowseResults();
  }
}

/* -----------------------------------------------
   CATALOGUE LOADER
   ----------------------------------------------- */
function loadCatalogue() {
  if (state.catalogue.length > 0) return;
  state.loading.catalogue = true;
  var xhr = new XMLHttpRequest();
  xhr.open('GET', WORKER_URL + '/api/catalogue');
  xhr.onload = function() {
    if (xhr.status === 200) {
      try {
        state.catalogue = JSON.parse(xhr.responseText);
        buildBrowseChips();
      } catch(e) { showError('Could not parse catalogue data'); }
    } else {
      showError('Could not load resource catalogue (' + xhr.status + ')');
    }
    state.loading.catalogue = false;
  };
  xhr.onerror = function() { showError('Network error loading catalogue'); state.loading.catalogue = false; };
  xhr.send();
}

/* -----------------------------------------------
   BROWSE CHIPS
   ----------------------------------------------- */
function buildBrowseChips() {
  var subjects = [{ key: 'Literacy', label: 'Literacy' }, { key: 'Maths', label: 'Maths' }];
  var grades = [{ key: 'Infants', label: 'Infants' }, { key: '1st-2nd', label: '1st\u20132nd' }, { key: '3rd-4th', label: '3rd\u20134th' }, { key: '5th-6th', label: '5th\u20136th' }];
  var formats = [{ key: 'Worksheet', label: 'Worksheet' }, { key: 'Game', label: 'Game' }, { key: 'Poster', label: 'Poster' }, { key: 'Activity', label: 'Activity' }, { key: 'Flashcards', label: 'Flashcards' }, { key: 'Assessment', label: 'Assessment' }, { key: 'Lesson_Plan', label: 'Lesson Plan' }, { key: 'Other', label: 'Other' }];
  var seasons = [{ key: 'Christmas', label: 'Christmas' }, { key: 'Halloween', label: 'Halloween' }, { key: 'Easter', label: 'Easter' }, { key: 'St_Patricks', label: "St Patrick's" }, { key: 'Valentines', label: "Valentine's" }, { key: 'Spring', label: 'Spring' }, { key: 'Summer', label: 'Summer' }, { key: 'Back_to_School', label: 'Back to School' }, { key: 'End_of_Year', label: 'End of Year' }];

  renderChipGroup('browseSubjectChips', subjects, 'subject');
  renderChipGroup('browseGradeChips', grades, 'grade');
  renderChipGroup('browseFormatChips', formats, 'format');
  renderChipGroup('browseSeasonChips', seasons, 'season');
}

function renderChipGroup(containerId, chips, category) {
  var container = document.getElementById(containerId);
  container.innerHTML = '';
  for (var i = 0; i < chips.length; i++) {
    var chip = chips[i];
    var el = document.createElement('span');
    el.className = 'chip';
    el.textContent = chip.label;
    el.setAttribute('data-key', chip.key);
    el.addEventListener('click', (function(cat, key) {
      return function() {
        this.classList.toggle('active');
        if (this.classList.contains('active')) {
          state.browseFilters[cat][key] = true;
        } else {
          delete state.browseFilters[cat][key];
        }
        renderBrowseResults();
      };
    })(category, chip.key));
    container.appendChild(el);
  }
}

function renderBrowseResults() {
  if (state.activeMode !== 'browse') return;

  var allEmpty = objSize(state.browseFilters.subject) === 0 &&
                 objSize(state.browseFilters.grade) === 0 &&
                 objSize(state.browseFilters.format) === 0 &&
                 objSize(state.browseFilters.season) === 0;

  if (allEmpty) {
    document.getElementById('emptyState').classList.remove('hidden');
    document.getElementById('resultsContainer').classList.add('hidden');
    return;
  }

  var filtered = state.catalogue.filter(function(item) {
    if (objSize(state.browseFilters.subject) > 0 && !objHas(state.browseFilters.subject, item.subject)) return false;
    if (objSize(state.browseFilters.grade) > 0 && !objHas(state.browseFilters.grade, item.grade_band)) return false;
    if (objSize(state.browseFilters.format) > 0 && !objHas(state.browseFilters.format, item.format)) return false;
    if (objSize(state.browseFilters.season) > 0 && !objHas(state.browseFilters.season, item.season)) return false;

    // Apply refinement chip filters on top of browse filters
    var refKeys = objKeys(state.refinementChips);
    if (refKeys.length > 0) {
      var matches = refKeys.some(function(key) {
        return (item.format && item.format.toLowerCase() === key.toLowerCase()) ||
               (item.grade_band && item.grade_band.toLowerCase() === key.toLowerCase()) ||
               (item.season && item.season.toLowerCase() === key.toLowerCase());
      });
      if (!matches) return false;
    }
    return true;
  });

  state.results = filtered;
  state.gaps = [];
  renderResults();
}

/* -----------------------------------------------
   SEARCH FUNCTIONS
   ----------------------------------------------- */
function guidedSearch(e) {
  e.preventDefault();
  var s = state.guidedSelections;
  var outcomeData;
  try { outcomeData = JSON.parse(s.outcome); } catch(ex) { showError('Please select a valid outcome.'); return false; }
  state.lastQuery = {
    type: 'guided',
    query: [s.subject, s.strand, outcomeData.code, (outcomeData.label || outcomeData.name)].filter(Boolean).join(' - '),
    subject: s.subject,
    strand: s.strand,
    stage: s.stage,
    outcome_code: outcomeData.code,
    outcome_label: outcomeData.label || outcomeData.name,
    element: outcomeData.element || null,
    constraints: document.getElementById('gConstraints').value || null,
  };
  performSearch();
  return false;
}

function freetextSearch(e) {
  e.preventDefault();
  var query = document.getElementById('ftQuery').value.trim();
  if (!query) return false;
  state.lastQuery = { type: 'freetext', query: query };
  performSearch();
  return false;
}

function performSearch() {
  state.loading.search = true;
  setSearchLoading(true);
  showResultsLoading();

  var xhr = new XMLHttpRequest();
  xhr.open('POST', WORKER_URL + '/api/query');
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.onload = function() {
    state.loading.search = false;
    setSearchLoading(false);
    hideResultsLoading();
    if (xhr.status === 200) {
      try {
        var data = JSON.parse(xhr.responseText);
        state.results = data.resources || data.results || [];
        state.gaps = data.gaps || [];
        renderResults();
      } catch(e) { showError('Invalid response from server'); }
    } else {
      showError('Search failed (' + xhr.status + ')');
    }
  };
  xhr.onerror = function() { state.loading.search = false; setSearchLoading(false); hideResultsLoading(); showError('Network error during search'); };
  xhr.send(JSON.stringify(state.lastQuery));
}

function setSearchLoading(loading) {
  var btn = document.getElementById('gSearchBtn');
  if (btn) { btn.disabled = loading; btn.textContent = loading ? 'Searching...' : 'Search'; }
  var ftBtn = document.querySelector('#panel-freetext button[type="submit"]');
  if (ftBtn) { ftBtn.disabled = loading; ftBtn.textContent = loading ? 'Searching...' : 'Search'; }
}

function showResultsLoading() {
  document.getElementById('emptyState').classList.add('hidden');
  var container = document.getElementById('resultsContainer');
  container.classList.remove('hidden');
  container.innerHTML = '<div class="loading-spinner"><div class="spinner"></div><span>Searching your catalogue...</span></div>';
}

function hideResultsLoading() {
  var container = document.getElementById('resultsContainer');
  if (container.querySelector('.loading-spinner')) {
    container.innerHTML = '';
  }
}

/* -----------------------------------------------
   EVENT DELEGATION
   ----------------------------------------------- */
function handleResultClick(e) {
  var t = e.target;
  // Walk up from the clicked element
  while (t) {
    if (t.nodeType !== 1) { t = t.parentNode; continue; }
    var action = t.getAttribute && t.getAttribute('data-action');
    if (action) {
      e.preventDefault();
      if (action === 'search-curriculum') {
        searchCurriculumOnline(t.getAttribute('data-code'), t.getAttribute('data-label'), t.getAttribute('data-stage'));
        return;
      }
      if (action === 'generate-lesson') {
        generateLessonPlan(t.getAttribute('data-code'), t.getAttribute('data-label'), t.getAttribute('data-stage'), t);
        return;
      }
      if (action === 'refinement-chip') {
        var key = t.getAttribute('data-key');
        t.classList.toggle('active');
        state.refinementChips[key] = t.classList.contains('active') ? true : undefined;
        if (!state.refinementChips[key]) delete state.refinementChips[key];
        applyRefinements();
        return;
      }
      if (action === 'dismiss-suggestion') {
        var el = document.getElementById(t.getAttribute('data-sid'));
        if (el) el.remove();
        return;
      }
    }
    if (t === document.getElementById('resultsContainer')) break;
    t = t.parentNode;
  }
}

/* -----------------------------------------------
   RESULTS RENDERING
   ----------------------------------------------- */
function forceRefresh() {
  renderResults();
}

function renderResults() {
  var emptyEl = document.getElementById('emptyState');
  var container = document.getElementById('resultsContainer');

  var hasResults = state.results.length > 0;
  var hasGaps = state.gaps.length > 0;

  if (!hasResults && !hasGaps) {
    emptyEl.classList.remove('hidden');
    container.classList.add('hidden');
    return;
  }

  emptyEl.classList.add('hidden');
  container.classList.remove('hidden');

  // Apply refinement chip filtering
  var activeRefinementKeys = objKeys(state.refinementChips);
  var filteredResults = state.results;
  if (activeRefinementKeys.length > 0 && state.activeMode !== 'browse') {
    filteredResults = state.results.filter(function(r) {
      return activeRefinementKeys.some(function(key) {
        return (r.format && r.format.toLowerCase() === key.toLowerCase()) ||
               (r.grade_band && r.grade_band.toLowerCase() === key.toLowerCase()) ||
               (r.season && r.season.toLowerCase() === key.toLowerCase());
      });
    });
  }

  // Sort by confidence descending (highest match first)
  filteredResults = filteredResults.slice().sort(function(a, b) {
    return (b.confidence || 0) - (a.confidence || 0);
  });

  var parts = [];

  // Gaps section (above the split layout)
  if (hasGaps) {
    parts.push('<div class="gaps-section">');
    for (var gi = 0; gi < state.gaps.length; gi++) {
      var gap = state.gaps[gi];
      var gCode = gap.outcome_code || gap.code || gap.id || '';
      var gLabel = gap.description || gap.label || gap.name || '';
      var gStage = gap.grade_band || gap.stage || '';
      parts.push(
        '<div class="gap-card" style="margin-bottom:10px">' +
        '<span class="gap-icon">&#9888;</span>' +
        '<span class="gap-text">No resources found for <strong>' + esc(gCode) + ' (' + esc(gLabel) + ', ' + esc(gStage) + ')</strong></span>' +
        '<span class="gap-actions">' +
        '<button class="btn btn-secondary btn-sm" data-action="search-curriculum" data-code="' + esc(gCode) + '" data-label="' + esc(gLabel) + '" data-stage="' + esc(gStage) + '">Search curriculumonline.ie</button>' +
        '<button class="btn btn-secondary btn-sm" data-action="generate-lesson" data-code="' + esc(gCode) + '" data-label="' + esc(gLabel) + '" data-stage="' + esc(gStage) + '">Generate lesson plan</button>' +
        '</span>' +
        '</div>'
      );
    }
    parts.push('</div>');
  }

  // Header
  parts.push('<div class="results-header"><h2>' + filteredResults.length + ' resource' + (filteredResults.length !== 1 ? 's' : '') + ' found</h2></div>');
  parts.push(renderRefinementBar());

  // Two-panel layout
  parts.push('<div class="results-layout">');

  // Left: results grid
  parts.push('<div class="results-panel"><div class="results-grid">');
  for (var vi = 0; vi < filteredResults.length; vi++) {
    parts.push(renderResultCardHTML(filteredResults[vi]));
  }
  parts.push('</div></div>');

  // Right: bundle sidebar
  parts.push('<div class="bundle-panel">');
  parts.push(renderBundleSidebarHTML());
  parts.push('</div>');

  parts.push('</div>'); // close results-layout

  container.innerHTML = parts.join('');

  // Directly attach click handlers to card-add and bundle-item buttons
  var btns = container.querySelectorAll('.card-add button[data-action="select"]');
  for (var b = 0; b < btns.length; b++) {
    (function(btn) {
      btn.onclick = function(e) {
        if (e) { e.preventDefault(); e.stopPropagation(); }
        var id = btn.getAttribute('data-id');
        if (objHas(state.selectedIds, id)) { delete state.selectedIds[id]; }
        else { state.selectedIds[id] = true; }
        forceRefresh();
        return false;
      };
    })(btns[b]);
  }
  var rmvs = container.querySelectorAll('.bundle-item button[data-action="select"]');
  for (var r = 0; r < rmvs.length; r++) {
    (function(btn) {
      btn.onclick = function(e) {
        if (e) { e.preventDefault(); e.stopPropagation(); }
        delete state.selectedIds[btn.getAttribute('data-id')];
        forceRefresh();
        return false;
      };
    })(rmvs[r]);
  }

  setupRefinementListeners();
}

function renderBundleSidebarHTML() {
  var selectedCount = objSize(state.selectedIds);
  var html = '<div class="bundle-sidebar"><h3>&#128230; Your Bundle</h3>';

  if (selectedCount === 0) {
    html += '<p class="bundle-empty">No resources selected yet.<br>Click "+ Add to bundle" on any resource card.</p>';
  } else {
    for (var j = 0; j < state.results.length; j++) {
      var r = state.results[j];
      var rid = r.id || r.filename;
      if (objHas(state.selectedIds, rid)) {
        var isAi = r.ai_generated === true;
        html += '<div class="bundle-item">' +
          '<span class="bundle-item-name">' +
          esc(r.filename || 'Untitled') +
          (isAi ? '<span class="ai-tag">[AI-Generated]</span>' : '') +
          '</span>' +
          '<button data-action="select" data-id="' + esc(rid) + '">Remove</button>' +
          '</div>';
      }
    }
  }

  html += '<div class="bundle-download">';
  html += '<button class="btn btn-primary" ' + (selectedCount === 0 ? 'disabled' : '') + ' onclick="triggerBundle()">&#128230; Download Bundle';
  if (selectedCount > 0) html += ' <span class="bundle-badge">' + selectedCount + '</span>';
  html += '</button>';
  html += '<div class="bundle-count-footer">' + selectedCount + ' resource' + (selectedCount !== 1 ? 's' : '') + ' selected</div>';
  html += '</div></div>';

  return html;
}

function renderResultCardHTML(r) {
  var id = r.id || r.filename;
  var isAi = r.ai_generated === true;
  var isSelected = objHas(state.selectedIds, id);
  var safeId = 'card-' + id.replace(/[^a-zA-Z0-9]/g, '-');

  var classes = 'card';
  if (isAi) classes += ' ai-generated';
  if (isSelected) classes += ' selected';

  var fullText = r.extracted_text_sample || r.description || '';
  var desc = fullText.substring(0, 140);

  var badges = '';
  if (isAi) badges += '<span class="badge badge-ai">AI Generated</span>';
  if (r.subject) badges += '<span class="badge badge-subject">' + esc(r.subject) + '</span>';
  if (r.grade_band) badges += '<span class="badge badge-grade">' + esc(r.grade_band) + '</span>';
  if (r.format) badges += '<span class="badge badge-format">' + esc(r.format) + '</span>';
  if (r.confidence != null) badges += '<span class="badge badge-confidence">' + Math.round(r.confidence * 100) + '% match</span>';

  var addClass = isSelected ? ' remove-action' : '';
  var addText = isSelected ? '- Remove' : '+ Add to bundle';

  var expandHtml = '';
  if (isAi && fullText.length > 140) {
    expandHtml =
      '<div class="card-description">' + esc(desc) + '... ' +
      '<button class="btn btn-sm btn-secondary" style="margin-left:4px;font-size:0.65rem" onclick="var el=document.getElementById(\'' + safeId + '-full\');var btn=this;if(el.classList.contains(\'hidden\')){el.classList.remove(\'hidden\');btn.textContent=\'Hide plan\'}else{el.classList.add(\'hidden\');btn.textContent=\'Show full plan\'}">Show full plan</button>' +
      '</div>' +
      '<div class="card-description hidden" id="' + safeId + '-full" style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;max-height:260px;overflow-y:auto;font-size:0.72rem;line-height:1.5;white-space:pre-wrap;font-family:var(--font-mono)">' + esc(fullText) + '</div>';
  } else {
    expandHtml = '<div class="card-description">' + esc(desc) + '</div>';
  }

  return '<div class="' + classes + '" data-id="' + esc(id) + '">' +
    '<div class="card-filename">' + esc(r.filename || 'Untitled Resource') + '</div>' +
    expandHtml +
    '<div class="card-badges">' + badges + '</div>' +
    '<div class="card-add" style="display:flex;justify-content:space-between;align-items:center">' +
    (r.onedrive_path ? '<a href="https://modernisetemp-my.sharepoint.com/personal/dan_modernise_ie/Documents/NCI/Teaching%20Resources/' + r.onedrive_path.replace(/\\/g, '/').split('/').map(function(s) { return encodeURIComponent(s); }).join('/') + '" target="_blank" rel="noopener" class="od-link">Open in OneDrive</a>' : '<span></span>') +
    '<button class="' + addClass + '" data-action="select" data-id="' + esc(id) + '">' + addText + '</button>' +
    '</div>' +
    '</div>';
}

function renderRefinementBar() {
  return '<div class="refinement-bar" id="refinementBar">' +
    '<label>Refine:</label>' +
    '<div class="chip-group" id="refinementChips">' +
    '<span class="chip" data-action="refinement-chip" data-key="Worksheet">Worksheet</span>' +
    '<span class="chip" data-action="refinement-chip" data-key="Game">Game</span>' +
    '<span class="chip" data-action="refinement-chip" data-key="Activity">Activity</span>' +
    '<span class="chip" data-action="refinement-chip" data-key="Poster">Poster</span>' +
    '<span class="chip" data-action="refinement-chip" data-key="Flashcards">Flashcards</span>' +
    '<span class="chip" data-action="refinement-chip" data-key="Infants">Infants</span>' +
    '<span class="chip" data-action="refinement-chip" data-key="1st-2nd">1st-2nd</span>' +
    '<span class="chip" data-action="refinement-chip" data-key="3rd-4th">3rd-4th</span>' +
    '<span class="chip" data-action="refinement-chip" data-key="5th-6th">5th-6th</span>' +
    '<span class="chip" data-action="refinement-chip" data-key="Christmas">Christmas</span>' +
    '<span class="chip" data-action="refinement-chip" data-key="Halloween">Halloween</span>' +
    '<span class="chip" data-action="refinement-chip" data-key="Easter">Easter</span>' +
    '</div>' +
    '<input type="text" id="refinementTextInput" placeholder="Filter by keyword...">' +
    '</div>';
}

function setupRefinementListeners() {
  var input = document.getElementById('refinementTextInput');
  if (input) {
    input.value = state.refinementText;
    var replaceInput = input.cloneNode(true);
    input.parentNode.replaceChild(replaceInput, input);
    replaceInput.addEventListener('input', function() {
      state.refinementText = replaceInput.value;
      debounceRefinement();
    });
  }

  var keys = objKeys(state.refinementChips);
  var chips = document.querySelectorAll('#refinementChips .chip');
  for (var i = 0; i < chips.length; i++) {
    var chip = chips[i];
    var key = chip.getAttribute('data-key');
    if (objHas(state.refinementChips, key)) {
      chip.classList.add('active');
    } else {
      chip.classList.remove('active');
    }
  }
}

var refinementTimer;
function debounceRefinement() {
  clearTimeout(refinementTimer);
  refinementTimer = setTimeout(applyRefinements, 300);
}

function applyRefinements() {
  var hasChips = objSize(state.refinementChips) > 0;
  var hasText = state.refinementText.trim().length > 0;

  if (state.activeMode === 'browse') {
    renderBrowseResults();
    return;
  }

  if (!hasChips && !hasText) {
    renderResults();
    return;
  }

  if (hasText) {
    state.loading.search = true;
    showResultsLoading();
    var xhr = new XMLHttpRequest();
    xhr.open('POST', WORKER_URL + '/api/query');
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onload = function() {
      state.loading.search = false;
      hideResultsLoading();
      if (xhr.status === 200) {
        try {
          var data = JSON.parse(xhr.responseText);
          state.results = data.resources || data.results || [];
          state.gaps = data.gaps || [];
        } catch(e) {}
      }
      renderResults();
    };
    xhr.onerror = function() { state.loading.search = false; hideResultsLoading(); renderResults(); };
    xhr.send(JSON.stringify({
      type: 'refine',
      base_query: state.lastQuery,
      refinement_text: state.refinementText.trim(),
      refinement_chips: objKeys(state.refinementChips),
    }));
  } else {
    renderResults();
  }
}

/* -----------------------------------------------
/* -----------------------------------------------
   GAP ACTIONS
   ----------------------------------------------- */
function searchCurriculumOnline(code, label, stage) {
  var url = 'https://curriculumonline.ie/search/?q=' + encodeURIComponent(code + ' ' + label);
  window.open(url, '_blank');

  var sid = 'curr-sugg-' + code.replace(/[^a-zA-Z0-9]/g, '');
  var html = '<div class="suggestion-card" id="' + sid + '">' +
    '<span class="sugg-text"><strong>curriculumonline.ie</strong> &mdash; Search results for <em>' + esc(code) + ': ' + esc(label) + '</em></span>' +
    '<button class="btn btn-success btn-sm" data-action="dismiss-suggestion" data-sid="' + sid + '">Done</button>' +
    '</div>';

  var gapsSection = document.querySelector('.gaps-section');
  if (gapsSection) {
    gapsSection.insertAdjacentHTML('beforeend', html);
  }
}

function generateLessonPlan(code, label, stage, btnEl) {
  var gapCard = btnEl ? btnEl.closest('.gap-card') : null;
  if (gapCard) {
    gapCard.querySelector('.gap-actions').innerHTML = '<div class="spinner" style="width:20px;height:20px"></div><span style="font-size:0.85rem;color:var(--text-muted)">Generating lesson plan...</span>';
  }

  state.loading.generate = true;
  var xhr = new XMLHttpRequest();
  xhr.open('POST', WORKER_URL + '/api/generate-lesson');
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.onload = function() {
    state.loading.generate = false;
    if (xhr.status === 200) {
      try {
        var data = JSON.parse(xhr.responseText);
        var aiCard = {
          id: 'ai-gen-' + Date.now(),
          filename: 'Lesson Plan: ' + label + ' (' + stage + ')',
          ai_generated: true,
          subject: state.lastQuery ? state.lastQuery.subject : '',
          grade_band: stage,
          format: 'Lesson_Plan',
          extracted_text_sample: data.content || data.plan || 'AI-generated lesson plan based on curriculum outcome.',
          confidence: 1.0,
        };
        state.results.unshift(aiCard);
        state.aiGenerated.push(aiCard);
        renderResults();
      } catch(e) { showError('Could not parse generated lesson plan'); restoreGapButtons(gapCard, code, label, stage); }
    } else {
      showError('Could not generate lesson plan (' + xhr.status + ')');
      restoreGapButtons(gapCard, code, label, stage);
    }
  };
  xhr.onerror = function() {
    state.loading.generate = false;
    showError('Network error during lesson plan generation');
    restoreGapButtons(gapCard, code, label, stage);
  };
  xhr.send(JSON.stringify({ outcome_code: code, outcome_label: label, stage: stage }));
}

function restoreGapButtons(gapCard, code, label, stage) {
  if (gapCard) {
    gapCard.querySelector('.gap-actions').innerHTML =
      '<button class="btn btn-secondary btn-sm" data-action="search-curriculum" data-code="' + esc(code) + '" data-label="' + esc(label) + '" data-stage="' + esc(stage) + '">Search curriculumonline.ie</button>' +
      '<button class="btn btn-secondary btn-sm" data-action="generate-lesson" data-code="' + esc(code) + '" data-label="' + esc(label) + '" data-stage="' + esc(stage) + '">Generate lesson plan</button>';
  }
}

/* -----------------------------------------------
   BUNDLE & DOWNLOAD
   ----------------------------------------------- */
function triggerBundle() {
  if (objSize(state.selectedIds) === 0) {
    showError('Select at least one resource to bundle.');
    return;
  }
  document.getElementById('downloadOverlay').classList.remove('hidden');
  doBundle();
}

function doBundle() {
  var overlay = document.getElementById('downloadOverlay');
  overlay.classList.remove('hidden');

  // Build generated_content array from selected AI-generated cards
  var generatedContent = [];
  for (var i = 0; i < state.aiGenerated.length; i++) {
    var a = state.aiGenerated[i];
    if (objHas(state.selectedIds, a.id)) {
      generatedContent.push({
        title: a.title || a.filename || 'Lesson Plan',
        markdown: a.extracted_text_sample || '',
      });
    }
  }

  // Build summary_md from current results
  var summaryLines = [];
  summaryLines.push('# Teacher\'s Pet - Resource Bundle');
  summaryLines.push('');
  if (state.lastQuery) {
    summaryLines.push('**Query:** ' + (state.lastQuery.query || 'Catalogue browse'));
    summaryLines.push('**Mode:** ' + (state.lastQuery.type || 'freetext'));
  }
  summaryLines.push('**Resources selected:** ' + objSize(state.selectedIds));
  if (generatedContent.length > 0) {
    summaryLines.push('**AI-generated plans included:** ' + generatedContent.length);
  }
  summaryLines.push('');
  summaryLines.push('## Selected Resources');
  for (var j = 0; j < state.results.length; j++) {
    var r = state.results[j];
    var rid = r.id || r.filename;
    if (objHas(state.selectedIds, rid)) {
      summaryLines.push('- **' + (r.filename || 'Untitled') + '**');
      if (r.ai_generated) summaryLines.push('  - [AI-Generated | Not Classroom-Tested]');
      if (r.subject) summaryLines.push('  - Subject: ' + r.subject);
      if (r.grade_band) summaryLines.push('  - Grade: ' + r.grade_band);
    }
  }
  summaryLines.push('');
  summaryLines.push('---');
  summaryLines.push('*Bundle assembled by Teacher\'s Pet, CA3 Final Project, August 2026.*');

  var summaryMd = summaryLines.join('\n');
  var payload = {
    resource_ids: objKeys(state.selectedIds),
    generated_content: generatedContent,
    summary_md: summaryMd,
    run_id: 'bundle-' + Date.now(),
  };

  var xhr = new XMLHttpRequest();
  xhr.open('POST', WORKER_URL + '/api/bundle');
  xhr.timeout = 60000; // 60s for mobile — Worker downloads + zips files
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.responseType = 'blob';
  xhr.ontimeout = function() { overlay.classList.add('hidden'); showError('Download timed out — try with fewer files.'); };
  xhr.onload = function() {
    overlay.classList.add('hidden');
    if (xhr.status === 200) {
      var blob = xhr.response;
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'teachers-pet-bundle-' + new Date().toISOString().slice(0, 19).replace(/:/g, '-') + '.zip';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } else {
      showError('Download failed (' + xhr.status + ')');
    }
  };
  xhr.onerror = function() { overlay.classList.add('hidden'); showError('Network error during download'); };
  xhr.send(JSON.stringify(payload));
}

/* -----------------------------------------------
   UTILITY FUNCTIONS
   ----------------------------------------------- */
function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function showError(msg) {
  var existing = document.querySelector('.error-banner');
  if (existing) existing.remove();

  var banner = document.createElement('div');
  banner.className = 'error-banner';
  banner.textContent = msg;
  banner.addEventListener('click', function() { banner.remove(); });

  var main = document.querySelector('.main');
  main.insertBefore(banner, main.firstChild);

  setTimeout(function() { if (banner.parentNode) banner.remove(); }, 15000);
}

/* -----------------------------------------------
   INITIALISATION
   ----------------------------------------------- */
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('resultsContainer').addEventListener('click', handleResultClick);

  initTaxonomies();

  function initTaxonomies() {
    state.taxonomies.language = EMBED_LANG;
    state.taxonomies.maths = EMBED_MATHS;
    populateGuidedDropdowns();
  }
});
